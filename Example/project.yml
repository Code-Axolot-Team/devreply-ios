# XcodeGen spec (CLAUDE.md rule 8: never hand-edit project.pbxproj). Run: xcodegen
name: DevReplyExample
options:
  bundleIdPrefix: com.codeaxolot.devreply
  deploymentTarget:
    iOS: "17.0"
packages:
  DevReply:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Your Apple team (or pass DEVELOPMENT_TEAM=… to xcodebuild) and your app's iOS public key.
    DEVELOPMENT_TEAM: ""
    DEVREPLY_PK: pk_YOUR_PUBLIC_KEY
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DevReplyExample:
    type: application
    platform: iOS
    sources: [Sources]
    # Generated by xcodegen (merged with the generated Info.plist): carries the public key into the app.
    info:
      path: Info.plist
      properties:
        DevReplyPublicKey: $(DEVREPLY_PK)
    entitlements:
      path: Sources/DevReplyExample.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: DevReply
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codeaxolot.devreply.example
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevReply Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  DevReplyExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DevReplyExample
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DevReplyExample
schemes:
  DevReplyExample:
    build:
      targets:
        DevReplyExample: all
    test:
      targets: [DevReplyExampleUITests]
